name: Model source release

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: model-source-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Check version and existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^beatweaveVersion=//p' gradle.properties)
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exit 0; fi
          test -f "docs/releases/$version.md"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        if: steps.version.outputs.value != ''
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        if: steps.version.outputs.value != ''
      - name: Install pinned Android configuration tools
        if: steps.version.outputs.value != ''
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-35" "build-tools;34.0.0" \
            "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Restore and verify unchanged model weights
        if: steps.version.outputs.value != ''
        run: |
          curl --fail --location --retry 3 \
            https://github.com/adrielGGmotion/BeatWeave/releases/download/v0.10.0/BeatWeave-models-0.10.0.zip \
            --output /tmp/beatweave-models.zip
          echo "7222c2f0421f559b8a2f12e9fb3a74918c74097c3a00fc1c32a244ff4d2b7a5b  /tmp/beatweave-models.zip" | sha256sum --check
          unzip /tmp/beatweave-models.zip 'learned-beats/models/*.onnx'
          python3 tools/check-models.py
      - name: Verify inference and package models
        if: steps.version.outputs.value != ''
        run: |
          ./gradlew --no-daemon --max-workers=2 :learned-beats:modelIntegrationTest modelDistribution
          cd dist
          sha256sum BeatWeave-models-*.zip > "BeatWeave-models-${{ steps.version.outputs.value }}.zip.sha256"
      - name: Publish matching source and model release
        if: steps.version.outputs.value != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh release create "v$RELEASE_VERSION" \
            "dist/BeatWeave-models-$RELEASE_VERSION.zip" \
            "dist/BeatWeave-models-$RELEASE_VERSION.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" \
            --prerelease --title "BeatWeave $RELEASE_VERSION" \
            --notes-file "docs/releases/$RELEASE_VERSION.md"
