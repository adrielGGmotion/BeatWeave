name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: JVM tests and Android libraries
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
      - name: Install Android build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-35" "build-tools;34.0.0" \
            "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Run tests without model files
        run: |
          ./gradlew --no-daemon --max-workers=2 \
            -PbeatweaveCmake="$ANDROID_HOME/cmake/3.22.1/bin/cmake" \
            :analysis:jvmTest :learned-beats:jvmTest :rubberband:jvmTest
      - name: Build and publish to a local directory
        run: |
          ./gradlew --no-daemon --max-workers=2 \
            publishAllPublicationsToLocalRepository
      - name: Verify release artifacts and bundled JVM native loading
        run: |
          python3 tools/check-release.py
          ./gradlew --no-daemon --max-workers=2 -p examples/jvm \
            -PbeatweaveGroup="$(sed -n 's/^beatweaveGroup=//p' gradle.properties)" \
            -PbeatweaveVersion="$(sed -n 's/^beatweaveVersion=//p' gradle.properties)" \
            checkPublishedJars nativeSmoke
      - name: Upload Ubuntu 24.04 JVM native library
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-x86_64-native-ubuntu-24.04
          path: rubberband/build/hostNative/libbeatweave_rubberband.so
          if-no-files-found: error
          retention-days: 7
